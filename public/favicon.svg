<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="droneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>
  <!-- Vibrant Gradient Background Badge -->
  <rect width="32" height="32" rx="7" fill="url(#droneGrad)"/>
  
  <!-- Tactical Drone Diagonal Arms -->
  <line x1="16" y1="16" x2="6.5" y2="6.5" stroke="#030712" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="25.5" y2="6.5" stroke="#030712" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="6.5" y2="25.5" stroke="#030712" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="25.5" y2="25.5" stroke="#030712" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Quad Rotors -->
  <ellipse cx="6.5" cy="6.5" rx="4.5" ry="2.0" fill="#030712"/>
  <ellipse cx="25.5" cy="6.5" rx="4.5" ry="2.0" fill="#030712"/>
  <ellipse cx="6.5" cy="25.5" rx="4.5" ry="2.0" fill="#030712"/>
  <ellipse cx="25.5" cy="25.5" rx="4.5" ry="2.0" fill="#030712"/>
  
  <!-- Center Drone Fuselage -->
  <rect x="11.5" y="11.5" width="9" height="9" rx="2" fill="#030712"/>
  
  <!-- Core Optical Sensor / Gimbal Lens -->
  <circle cx="16" cy="16" r="2.0" fill="#00e5ff"/>
  <circle cx="16" cy="21.2" r="1.3" fill="#030712"/>
</svg>
